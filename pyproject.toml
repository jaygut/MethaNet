[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "methanet"
version = "1.0.0"
description = "Transfer learning for methane flux prediction from microbiome data"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.11"
authors = [
    { name = "Alon Philosof", email = "aphilosof@gmail.com" },
    { name = "Jay Gutierrez", email = "jg@graphoflife.com" },
]
keywords = [
    "methane",
    "metagenomics",
    "transfer-learning",
    "microbiome",
    "climate",
    "blue-carbon",
    "carbon-accounting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "biopython>=1.79",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "transformers>=4.38",
    "xgboost>=2.0",
    "faiss-cpu>=1.7.4",
    "onnx>=1.15",
    "onnxruntime>=1.16",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "black>=23.0",
    "nbconvert>=7.0",
    "nbformat>=5.0",
]
bioinformatics = [
    "biopython>=1.79",
    "pyhmmer>=0.11",
    "pyfaidx>=0.7",
]
curation = [
    "biopython>=1.79",
    "pandas>=1.3",
    "pyarrow>=10.0",
    "requests>=2.31",
    "tqdm>=4.66",
]
annotation = [
    "biopython>=1.79",
    "numpy>=1.21",
    "pandas>=1.3",
    "pyhmmer>=0.11",
    "networkx>=2.8",
    "scipy>=1.10",
]
embeddings = [
    "torch>=2.0",
    "transformers>=4.38",
    "numpy>=1.21",
    "scikit-learn>=1.4",
    "numba>=0.58",
    "umap-learn>=0.5",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.0",
    "tqdm>=4.66",
    "h5py>=3.10",
]
adaptation = [
    "torch>=2.0",
    "scikit-learn>=1.4",
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.10",
    "optuna>=3.0",
]
prediction = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.4",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "faiss-cpu>=1.7.4",
    "shap>=0.45,<0.50",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
]
pipeline = [
    "snakemake>=8.0",
    "dvc>=3.0",
    "mlflow>=2.0",
    "pandera>=0.17",
]
api = [
    "onnx>=1.15",
    "onnxruntime>=1.16",
    "skl2onnx>=1.16",
]
all = [
    "methanet[ml,bioinformatics,prediction,api]",
]

[project.urls]
Homepage = "https://github.com/jaygut/MethaNet"
Repository = "https://github.com/jaygut/MethaNet"
Documentation = "https://github.com/jaygut/MethaNet#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/methanet", "src/api_bridge"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
