name: Core contracts CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install locked core and test dependencies
        run: uv sync --frozen --extra dev
      - name: Check documentation links and core data contracts
        run: |
          uv run --no-sync pytest -q \
            tests/unit/test_repository_docs.py \
            tests/unit/test_atlas_foundation.py \
            tests/unit/test_feature_fusion_contract.py \
            tests/unit/test_mbag_core.py \
            tests/unit/test_release_parity_validator.py
      - name: Validate tracked atlas foundation
        run: uv run --no-sync python scripts/reports/validate_atlas_foundation.py
