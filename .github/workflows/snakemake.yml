name: Snakemake CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install workflow dependencies
        run: uv sync --extra dev --extra pipeline
      - name: Lint workflow
        run: uv run snakemake --lint -s workflow/Snakefile
      - name: Dry run production template
        run: uv run snakemake -n -s workflow/Snakefile --configfile configs/pipeline.yaml
      - name: Dry run smoke config
        run: uv run snakemake -n -s workflow/Snakefile --configfile configs/pipeline.smoke.yaml
