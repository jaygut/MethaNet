name: Deploy landing to GitHub Pages

# Auto-publishes the EmergentBiome / MethaNet landing page to the gh-pages branch
# whenever its source changes on main. It refreshes ONLY the landing files and never
# touches the already-published /report/, the dated atlas snapshots, or the CNAME
# (custom domain). The heavy report bundle is generated by the pipeline and deployed
# with tools/publish_site.sh deploy --push; this Action does not rebuild it.

on:
  push:
    branches: [main]
    paths:
      - 'web/emergentbiome-methanet/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (main)
        uses: actions/checkout@v4

      - name: Checkout published site (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .ghpages

      - name: Assemble landing into gh-pages (preserve report/, CNAME, dated dirs)
        run: |
          set -euo pipefail
          SRC="web/emergentbiome-methanet"
          DEST=".ghpages"

          # Guard: the published report must already exist on gh-pages. We never build or
          # clobber it from this Action; if it is missing, abort rather than ship a broken site.
          test -f "$DEST/report/index.html" || { echo "::error::report/ missing on gh-pages; aborting."; exit 1; }

          # Refresh ONLY the landing files. Everything else on gh-pages (report/, the dated
          # mbag_nextgen_* snapshots, CNAME, .git) is left exactly as-is.
          for item in index.html styles.css main.js config.js lib scenes vendor data assets; do
            test -e "$SRC/$item" || { echo "::error::source $item missing on main (is lib/ committed?); aborting."; exit 1; }
            rm -rf "$DEST/$item"
            cp -R "$SRC/$item" "$DEST/$item"
          done
          touch "$DEST/.nojekyll"

          # Custom domain: keep emergentbiome.earth bound. Prefer the source CNAME; if absent,
          # keep whatever CNAME is already on the branch. Abort if we would end up with none.
          if [ -f "$SRC/CNAME" ]; then cp "$SRC/CNAME" "$DEST/CNAME"; fi
          test -s "$DEST/CNAME" || { echo "::error::no CNAME present; aborting to avoid breaking the custom domain."; exit 1; }

          # Final integrity guards before we touch the branch.
          test -f "$DEST/index.html" && test -f "$DEST/lib/prng.js" \
            && test -f "$DEST/lib/scene-base.js" && test -f "$DEST/data/atlas.json" \
            && test -f "$DEST/report/index.html"
          echo "Assembled landing OK. CNAME=$(cat "$DEST/CNAME")"

      - name: Commit and push to gh-pages
        run: |
          set -euo pipefail
          cd .ghpages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No landing changes to deploy."
          else
            git commit -m "Auto-deploy landing from main@${GITHUB_SHA::7}"
            git push origin gh-pages
            echo "Deployed. Live at https://emergentbiome.earth/ within ~1-2 min."
          fi
