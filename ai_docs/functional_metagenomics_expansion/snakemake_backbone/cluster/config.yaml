# Snakemake SLURM profile skeleton for Apolo-3.
# Snakemake versions differ in profile syntax; adapt to the installed version.

executor: slurm
jobs: 80
latency-wait: 120
rerun-incomplete: true
keep-going: false
printshellcmds: true
use-conda: true

default-resources:
  slurm_partition: "longjobs"
  runtime: "04:00:00"
  mem_mb: 16000
  cpus_per_task: 4

set-resources:
  resolve_manifest:
    slurm_partition: "longjobs"
    cpus_per_task: 1
    mem_mb: 8000
    runtime: "00:15:00"
  write_tool_db_manifest:
    slurm_partition: "longjobs"
    cpus_per_task: 1
    mem_mb: 8000
    runtime: "00:15:00"
  validate_eggnog_v2_db:
    slurm_partition: "longjobs"
    cpus_per_task: 4
    mem_mb: 16000
    runtime: "01:00:00"
  run_one_mag_tools:
    slurm_partition: "longjobs"
    cpus_per_task: 16
    mem_mb: 128000
    runtime: "24:00:00"
  eggnog_v2_contract:
    slurm_partition: "longjobs"
    cpus_per_task: 16
    mem_mb: 64000
    runtime: "12:00:00"
  curate_mag_contract:
    slurm_partition: "longjobs"
    cpus_per_task: 4
    mem_mb: 8000
    runtime: "01:00:00"
  consolidate_cohort_contract:
    slurm_partition: "longjobs"
    cpus_per_task: 4
    mem_mb: 64000
    runtime: "02:00:00"
