# Snakemake SLURM profile skeleton for Apolo-3.
# Snakemake versions differ in profile syntax; adapt to the installed version.

executor: slurm
jobs: 80
latency-wait: 120
rerun-incomplete: true
keep-going: false
printshellcmds: true
use-conda: true

default-resources:
  slurm_partition: "bigmem"
  runtime: "12:00:00"
  mem_mb: 64000
  cpus_per_task: 8

set-resources:
  checkm2_all:
    slurm_partition: "bigmem"
    cpus_per_task: 32
    mem_mb: 0
    runtime: "24:00:00"
  gunc_all:
    slurm_partition: "bigmem"
    cpus_per_task: 32
    mem_mb: 0
    runtime: "24:00:00"
  gtdbtk_all:
    slurm_partition: "bigmem"
    cpus_per_task: 64
    mem_mb: 0
    runtime: "48:00:00"
  drep_all:
    slurm_partition: "bigmem"
    cpus_per_task: 32
    mem_mb: 0
    runtime: "36:00:00"
  metabolic_g_all:
    slurm_partition: "bigmem"
    cpus_per_task: 64
    mem_mb: 0
    runtime: "48:00:00"

