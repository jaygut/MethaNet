# Apollo 3 configuration scaffold for the Snakemake production-contract runner.
# Override run_id/paths.results before a real cohort execution if needed.

run_id: fgx_snakemake_apollo3_contract

paths:
  project_root: /home/rsg-jcorre38/Jay_Proyects/MethaNet
  workdir: /home/rsg-jcorre38/Jay_Proyects/MethaNet
  scratch: /scratch/${USER}/methanet_fgx
  results: results/functional_metagenomics/fgx_snakemake_apollo3_contract
  logs: logs/functional_metagenomics/fgx_snakemake_apollo3_contract
  conda_sh: /opt/ohpc/pub/apps/miniconda3/etc/profile.d/conda.sh
  runner: scripts/slurm/run_one_mag_functional_smoke_apollo3.sh
  curator: scripts/curate_functional_mag_run.py
  consolidator: scripts/consolidate_functional_mag_cohort.py

inputs:
  # Required: one row per comparable MAG/bin. The 662-row ESM2 backbone remains
  # authoritative for embeddings, but no-bin rumen assembly-context records are
  # quarantined from MAG-level functional production by this scoped manifest.
  mag_manifest: results/functional_metagenomics/proteome_crosswalk_audit_20260612_0255/poc_662_functional_mag_manifest.mag_bin_only.tsv
  # Existing POC artifacts used by downstream analytics after the cohort
  # warehouse is built. They are not required by the production-contract DAG.
  embedding_metadata: results/blue_catalyst_poc/runs/apolo_full_20260228_080644_embed_20260305_061952/artifacts/embedding_metadata.tsv
  bridge_metrics: results/blue_catalyst_poc/interim_snapshots/apolo_full_20260228_080644_embed_20260305_061952_notebook_interim_20260306_055012/tables/embedding_projection_partial.tsv
  bridge_candidates: results/blue_catalyst_poc/interim_snapshots/apolo_full_20260228_080644_embed_20260305_061952_notebook_interim_20260306_055012/tables/alpha_transfer_candidates_top40.tsv

pilot:
  # Override at runtime with --config pilot_mag_id=<MAG_ID>.
  pilot_mag_id: null

databases:
  db_root: /home/rsg-jcorre38/scratch/methanet_db
  checkm2: /home/rsg-jcorre38/scratch/methanet_db/checkm2
  gtdbtk: /home/rsg-jcorre38/scratch/methanet_db/gtdbtk_r232/release232
  gunc_db: /home/rsg-jcorre38/scratch/methanet_db/gunc/gunc_db_progenomes3.dmnd
  eggnog_v2: /home/rsg-jcorre38/scratch/methanet_db/eggnog_v2
  eggnog_v3_preview: /home/rsg-jcorre38/scratch/methanet_db/eggnog_v3_preview
  kofam_profiles: /home/rsg-jcorre38/scratch/methanet_db/kofam/profiles/prokaryote.hal
  kofam_ko_list: /home/rsg-jcorre38/scratch/methanet_db/kofam/ko_list
  mcycdb_diamond: /home/rsg-jcorre38/scratch/methanet_db/mcycdb/MCycDB_2021.dmnd
  mcycdb_id2gene: /home/rsg-jcorre38/scratch/methanet_db/mcycdb/repo/id2gene.map
  scycdb_diamond: /home/rsg-jcorre38/scratch/methanet_db/scycdb/SCycDB_2020Mar.dmnd
  scycdb_id2gene: /home/rsg-jcorre38/scratch/methanet_db/scycdb/repo/id2gene.2020Mar.map
  dbcan: /home/rsg-jcorre38/scratch/methanet_db/dbcan
  dram: /home/rsg-jcorre38/scratch/methanet_db/dram
  metabolic: /home/rsg-jcorre38/scratch/methanet_db/metabolic/METABOLIC
  metabolic_repo: /home/rsg-jcorre38/scratch/methanet_db/metabolic/METABOLIC
  gapseq: /home/rsg-jcorre38/scratch/methanet_db/gapseq
  bakta_light: /home/rsg-jcorre38/scratch/methanet_db/bakta/db-light

params:
  fasta_extension: fa
  prodigal_mode: meta
  gtdbtk_release: R232
  derep_ani_species: 0.95
  derep_ani_mapping_catalog: 0.98
  diamond_evalue: 1e-10
  diamond_query_cover: 70
  diamond_subject_cover: 50
  diamond_identity: 35
  # Stable eggNOG-mapper v2 / emapperdb-5.0.2 lane. Keep v3/v7 isolated.
  run_eggnog_v2: true
  eggnog_mapper_version: 2.1.15
  eggnog_db_version: 5.0.2
  prepare_dbcan_cache: true
  compress_logs: true
  prune_success: true
  dbcan_compat_dir: /home/rsg-jcorre38/scratch/methanet_db/dbcan_compat_pressed
  run_eggnog_v3_preview: false
  run_dram: false
  run_dram2_beta: false
  run_metabolic: true
  run_bakta_optional: true
  run_gapseq_optional: false
  run_dbcan_cgc: true

threads:
  light: 4
  medium: 16
  heavy: 32
  gtdbtk: 64

resources:
  mem_light_mb: 8000
  mem_medium_mb: 64000
  mem_eggnog_mb: 64000
  mem_production_mb: 64000
  mem_consolidate_mb: 64000
  mem_heavy_mb: 256000
  mem_bigmem_mb: 0
