[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "emergentbiome-mvo"
version = "0.2.0"
description = "Evidence-first molecular verification ontology and local graph compiler"
requires-python = ">=3.11"
dependencies = ["rdflib>=7.1,<8", "pyshacl>=0.30,<0.32", "owlrl>=7.1,<8", "jsonschema>=4.23,<5", "neo4j>=5.28,<7", "pyarrow>=19,<25", "duckdb==1.4.4", "biopython==1.85"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mvo = "mvo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
