name: methanet-ml
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.11
  - pytorch=2.1
  - pytorch-cuda=12.1
  - scikit-learn=1.4
  - xgboost=2.0
  - faiss-gpu=1.7.4
  - numpy=1.26
  - pandas=2.1
  - h5py=3.10
  - pyarrow=14.0
  - joblib=1.3
  - pip:
    - transformers>=4.36
    - biopython>=1.82
    - onnx>=1.15
    - onnxruntime-gpu>=1.16
